<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PAINEL V3 - MIL GRAU</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#070707;color:#fff;padding:16px}.card{background:#111;border:1px solid #222;border-radius:20px;padding:22px;max-width:650px;margin:auto}input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;margin:8px 0}button{width:100%;padding:14px;border:none;border-radius:12px;background:#fff;color:#000;font-weight:900;cursor:pointer;margin-top:8px}.btn-red{background:#ff2e2e;color:#fff}.btn-ghost{background:#222;color:#fff}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;padding:10px;font-size:13px}.tabs button.ativo{background:#feda75;color:#000}.item{border:1px solid #2a2a2a;padding:14px;border-radius:14px;margin-top:12px}.item b{font-size:15px}.item p{opacity:.6;font-size:13px;margin:6px 0}.opt{background:#1a1a1a;border-radius:12px;padding:12px;margin-top:8px;display:flex;justify-content:space-between}label{font-size:12px;opacity:.5;letter-spacing:1px}.bar{height:8px;background:#222;border-radius:10px;margin-top:8px;overflow:hidden}.bar div{height:8px;background:linear-gradient(45deg,#feda75,#d62976);width:0%}</style>
</head>
<body>
<div class="card" id="login"><h2>PAINEL V3 🔒</h2><p style="opacity:.5;font-size:13px;margin:6px 0">Santa Albertina Mil Grau</p><input type="password" id="senha" placeholder="Senha"><button onclick="entrar()">ENTRAR</button></div>
<div class="card" id="painel" style="display:none">
<h2>PAINEL MIL GRAU 🔥</h2>
<div class="tabs">
<button id="t-not" class="ativo" onclick="mudarAba('noticias')">📰 Notícias</button>
<button id="t-cur" onclick="mudarAba('curiosidades')">🤔 Curiosidades</button>
<button id="t-pub" onclick="mudarAba('publis')">💼 Publis</button>
<button id="t-vot" onclick="mudarAba('votos')">🗳️ Enquete</button>
</div>
<div id="aba-form">
<label>TÍTULO</label><input id="titulo" placeholder="Ex: Chuva forte...">
<label>TEXTO</label><textarea id="texto" rows="4" placeholder="Escreve aqui..."></textarea>
<label>FOTO (link)</label><input id="foto" placeholder="Cole link da imagem">
<div id="campo-link" style="display:none"><label>LINK DA OFERTA (só pra publi)</label><input id="link" placeholder="https://wa.me/..."></div>
<button onclick="publicar()">PUBLICAR AGORA 🔥</button>
</div>
<div id="aba-votos" style="display:none"><div id="result"></div><button class="btn-red" onclick="zerarVotos()">ZERAR ENQUETE</button></div>
<hr style="margin:20px 0;border:1px solid #222">
<h3 id="titulo-lista">PUBLICADOS</h3><div id="lista"></div>
<button class="btn-ghost" onclick="carregar()">🔄 ATUALIZAR</button>
</div>
<script>
const BIN="9e7b031f582c92f3988d";
let ABA='noticias'; let DADOS=null;
function entrar(){if(document.getElementById('senha').value==="1000grau"){document.getElementById('login').style.display='none';document.getElementById('painel').style.display='block';carregar();}else alert('Senha errada');}
function mudarAba(a){
  ABA=a;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('ativo'));
  document.getElementById('t-'+(a==='noticias'?'not':a==='curiosidades'?'cur':a==='publis'?'pub':'vot')).classList.add('ativo');
  document.getElementById('aba-form').style.display=a==='votos'?'none':'block';
  document.getElementById('aba-votos').style.display=a==='votos'?'block':'none';
  document.getElementById('campo-link').style.display=a==='publis'?'block':'none';
  document.getElementById('titulo-lista').innerText=a==='votos'?'RESULTADO':'PUBLICADOS - '+a.toUpperCase();
  carregar();
}
async function carregar(){
  let r=await fetch(`https://api.npoint.io/${BIN}`); DADOS=await r.json();
  if(!DADOS.noticias) DADOS.noticias=[]; if(!DADOS.curiosidades) DADOS.curiosidades=[]; if(!DADOS.publis) DADOS.publis=[]; if(!DADOS.votos) DADOS.votos={v0:0,v1:0,v2:0,v3:0};
  let v=DADOS.votos; let total=(v.v0||0)+(v.v1||0)+(v.v2||0)+(v.v3||0);
  let nomes=["🔥 Bastidores","🎉 Eventos","💼 Comércio local","🚨 Notícias urgentes"];
  let hv=""; nomes.forEach((n,i)=>{let val=v['v'+i]||0; let perc=total?Math.round(val/total*100):0; hv+=`<div class="opt"><span>${n}</span><b>${val} votos • ${perc}%</b></div><div class="bar"><div style="width:${perc}%"></div></div>`});
  hv+=`<p style="font-size:12px;opacity:.5;margin-top:10px">Total: ${total} votos</p>`;
  document.getElementById('result').innerHTML=hv;
  if(ABA==='votos'){document.getElementById('lista').innerHTML='';return;}
  let arr=DADOS[ABA]; let html=""; if(!arr.length) html='<p style="opacity:.4;font-size:13px">Nenhum item ainda.</p>';
  arr.slice().reverse().forEach((n,idx)=>{let realIdx=arr.length-1-idx; html+=`<div class="item"><b>${n.titulo}</b><p>${n.texto.substring(0,100)}...</p><button class="btn-red" onclick="apagar(${realIdx})">APAGAR</button></div>`});
  document.getElementById('lista').innerHTML=html;
}
async function publicar(){
  let t=document.getElementById('titulo').value; let tx=document.getElementById('texto').value; let f=document.getElementById('foto').value; let l=document.getElementById('link').value;
  if(!t||!tx) return alert('Preenche título e texto');
  let r=await fetch(`https://api.npoint.io/${BIN}`); let d=await r.json();
  if(!d[ABA]) d[ABA]=[];
  d[ABA].push({titulo:t,texto:tx,foto:f,link:l,data:new Date().toLocaleDateString('pt-BR')});
  await fetch(`https://api.npoint.io/${BIN}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  alert('Publicado! Já tá no site 🔥');
  document.getElementById('titulo').value='';document.getElementById('texto').value='';document.getElementById('foto').value='';document.getElementById('link').value='';
  carregar();
}
async function apagar(i){
  if(!confirm('Apagar mesmo?'))return;
  let r=await fetch(`https://api.npoint.io/${BIN}`); let d=await r.json();
  d[ABA].splice(i,1);
  await fetch(`https://api.npoint.io/${BIN}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  carregar();
}
async function zerarVotos(){
  if(!confirm('Zerar todos os votos?'))return;
  let r=await fetch(`https://api.npoint.io/${BIN}`); let d=await r.json(); d.votos={v0:0,v1:0,v2:0,v3:0};
  await fetch(`https://api.npoint.io/${BIN}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  carregar();
}
</script>
</body>
</html>
