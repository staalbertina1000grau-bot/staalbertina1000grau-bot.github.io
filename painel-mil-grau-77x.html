<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM</title>
<!-- BLOQUEIA GOOGLE 100% -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache">
<meta name="googlebot" content="noindex, nofollow, noindex">
<meta name="referrer" content="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Anton&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#070707;color:#fff;min-height:100vh}
.login{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#111;border:1px solid #222;border-radius:24px;padding:32px;width:100%;max-width:380px;text-align:center}
input,textarea{width:100%;background:#161616;border:1px solid #2a2a2a;color:#fff;padding:14px;border-radius:12px;margin-top:10px}
button{width:100%;background:#fff;color:#000;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer;margin-top:12px}
.btn-g{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);color:#fff}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #1a1a1a;background:#0a0a0a;position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:8px;padding:16px 24px;border-bottom:1px solid #111;overflow:auto}
.tab{padding:10px 18px;border-radius:100px;background:#161616;border:1px solid #222;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.active{background:#fff;color:#000}
.panel{max-width:900px;margin:auto;padding:24px;display:none}
.panel.active{display:block}
.card{background:#111;border:1px solid #1f1f1f;border-radius:20px;padding:20px;margin-bottom:16px}
.preview{background:#000;border:1px solid #222;border-radius:16px;padding:16px;margin-top:16px;white-space:pre-wrap;font-size:11px;max-height:400px;overflow:auto}
h2{font-family:'Anton',sans-serif}
</style>
</head>
<body>

<div id="loginScreen" class="login">
<div class="login-box">
<h2>SANTA ALBERTINA<br><span style="background:linear-gradient(45deg,#feda75,#d62976);-webkit-background-clip:text;-webkit-text-fill-color:transparent">MIL GRAU</span></h2>
<p style="opacity:.5;font-size:11px;margin:8px 0 20px;letter-spacing:2px">PAINEL SECRETO</p>
<input type="password" id="pass" placeholder="Senha">
<button onclick="login()">ENTRAR</button>
<p id="loginErro" style="color:#ff3b30;font-size:12px;margin-top:10px;display:none">Senha errada</p>
</div>
</div>

<div id="app" style="display:none">
<div class="header">
<div style="font-weight:900">SANTA ALBERTINA <span style="color:#d62976">MIL GRAU</span> • ADM</div>
<div style="display:flex;gap:8px">
<a href="index.html" target="_blank" style="background:#161616;color:#fff;padding:8px 14px;border-radius:100px;font-size:12px;font-weight:700;text-decoration:none">VER SITE</a>
<button onclick="logout()" style="width:auto;padding:8px 14px;font-size:12px;background:#ff3b30;color:#fff;border-radius:100px">SAIR</button>
</div>
</div>

<div class="tabs">
<div class="tab active" onclick="openTab('enquete',this)">📊 VOTOS</div>
<div class="tab" onclick="openTab('noticias',this)">📰 Notícias</div>
<div class="tab" onclick="openTab('publi',this)">💼 Publi</div>
</div>

<div id="enquete" class="panel active">
<div class="card">
<h2>📊 VOTOS AO VIVO</h2>
<p style="opacity:.5;font-size:12px;margin:8px 0">Votos reais do site, de todo mundo</p>
<div id="resultadoVotos" style="margin-top:16px">Carregando...</div>
<button onclick="verVotos()" style="background:#222;color:#fff;border:1px solid #333">🔄 ATUALIZAR</button>
<button onclick="zerarVotos()" style="background:#ff3b30;color:#fff">ZERAR TUDO</button>
</div>
</div>

<div id="noticias" class="panel">
<h2>Criar Notícia</h2>
<div class="card">
<input id="n_titulo" placeholder="Título">
<input id="n_data" placeholder="Data" value="HOJE • SANTA ALBERTINA">
<input id="n_img" placeholder="Link da imagem">
<textarea id="n_texto" rows="4" placeholder="Texto..."></textarea>
<button class="btn-g" onclick="addNoticia()">GERAR CÓDIGO</button>
<div id="n_preview" class="preview" style="display:none"></div>
</div>
<div id="listaNoticias"></div>
</div>

<div id="publi" class="panel">
<h2>Anunciantes</h2>
<div class="card">
<input id="p_nome" placeholder="Nome">
<input id="p_contato" placeholder="Contato">
<input id="p_img" placeholder="Link da logo">
<button class="btn-g" onclick="addPubli()">GERAR CÓDIGO</button>
<div id="p_preview" class="preview" style="display:none"></div>
</div>
<div id="listaPubli"></div>
</div>

</div>

<script>
const SENHA="1000grau";
const NAMESPACE="santa-albertina-mil-grau-2026";
function login(){if(document.getElementById('pass').value===SENHA){localStorage.setItem('adm_logado','1');showApp()}else document.getElementById('loginErro').style.display='block'}
function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';renderAll();verVotos();}
function logout(){localStorage.removeItem('adm_logado');location.reload()}
if(localStorage.getItem('adm_logado')==='1')showApp();
function openTab(id,el){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active')}
function getData(k){return JSON.parse(localStorage.getItem('SAMG_'+k)||'[]')}
function setData(k,v){localStorage.setItem('SAMG_'+k,JSON.stringify(v))}
function addNoticia(){
let t=document.getElementById('n_titulo').value;if(!t)return alert('Título');
let code=`<div class="card noticia">\n  <img src="${document.getElementById('n_img').value}">\n  <small>${document.getElementById('n_data').value}</small>\n  <h3>${t}</h3>\n  <p>${document.getElementById('n_texto').value}</p>\n</div>`;
document.getElementById('n_preview').style.display='block';document.getElementById('n_preview').innerText=code;navigator.clipboard.writeText(code);
let arr=getData('noticias');arr.unshift({titulo:t,code});setData('noticias',arr);renderNoticias();
}
function addPubli(){
let n=document.getElementById('p_nome').value;if(!n)return alert('Nome');
let code=`<div class="card noticia" style="text-align:center">\n  <img src="${document.getElementById('p_img').value}" style="width:100px">\n  <h3>${n}</h3>\n  <p>${document.getElementById('p_contato').value}</p>\n</div>`;
document.getElementById('p_preview').style.display='block';document.getElementById('p_preview').innerText=code;navigator.clipboard.writeText(code);
let arr=getData('publis');arr.unshift({nome:n,code});setData('publis',arr);renderPubli();
}
function renderNoticias(){let arr=getData('noticias');document.getElementById('listaNoticias').innerHTML=arr.map((n,i)=>`<div class="card"><b>${n.titulo}</b><pre class="preview">${n.code}</pre><button onclick="del('noticias',${i})" style="background:#ff3b30;color:#fff">Excluir</button></div>`).join('')}
function renderPubli(){let arr=getData('publis');document.getElementById('listaPubli').innerHTML=arr.map((p,i)=>`<div class="card"><b>${p.nome}</b><pre class="preview">${p.code}</pre><button onclick="del('publis',${i})" style="background:#ff3b30;color:#fff">Excluir</button></div>`).join('')}
function renderAll(){renderNoticias();renderPubli()}
function del(k,i){let arr=getData(k);arr.splice(i,1);setData(k,arr);renderAll()}
async function verVotos(){
let html="";let total=0;let vals=[];
for(let i=0;i<4;i++){try{let r=await fetch(`https://api.countapi.xyz/get/${NAMESPACE}/voto${i}`);let j=await r.json();vals[i]=j.value||0;total+=vals[i];}catch{vals[i]=0}}
for(let i=0;i<4;i++){let perc=total?Math.round(vals[i]/total*100):0;html+=`<div style="display:flex;justify-content:space-between;margin-top:8px"><span>Opção ${i+1}: ${vals[i]} votos</span><b>${perc}%</b></div><div style="height:8px;background:#222;border-radius:10px;margin-bottom:10px"><div style="height:8px;width:${perc}%;background:linear-gradient(45deg,#feda75,#d62976);border-radius:10px"></div></div>`}
html+=`<b>TOTAL: ${total} votos</b>`;document.getElementById('resultadoVotos').innerHTML=html;
}
async function zerarVotos(){if(!confirm('Zerar tudo?'))return;for(let i=0;i<4;i++)await fetch(`https://api.countapi.xyz/set/${NAMESPACE}/voto${i}?value=0`);verVotos();}
</script>
</body>
</html>
